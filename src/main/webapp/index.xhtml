<!DOCTYPE html>
<html lang="de"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IU Concerts - Tickets für deine Lieblingsbands</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-music-note-beamed"></i> IU Concerts</a>
        </div>
    </nav>

    <div class="container mt-4 mt-lg-5">
        <h1 class="text-center mb-3 mb-lg-4">🎸 Kommende Konzerte 🎤</h1>
        
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3 g-lg-4">
            <ui:repeat var="concert" value="#{concertBean.getAllConcerts()}">
                <div class="col">

                    <ui:remove>
                    <!-- <div class="card h-100 concert-card" data-concert-id="#{concert.concertId}" data-tour="#{concert.tourName}" data-support="#{concertBean.getSupportActs(concert)}" data-description="#{concert.description}" data-rating="#{concert.rating}" data-video="#{concert.videoUrl}" data-venue="#{concert.venue.name}"> </div> -->
                    </ui:remove>

                    <div class="card h-100 concert-card" data-concert-id="#{concert.concertId}" data-venue="#{concert.venue.name}">
                        <img src="#{band.cover}" class="card-img-top" alt="#{concert.bandName}" />
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">#{concert.bandName}</h5>

                            <ui:remove>
                            <!-- <h6 class="text-muted">#{concert.tourName}</h6> -->
                            </ui:remove>

                            <p class="card-text flex-grow-1">#{concert.shortDesc}</p>
                            <div class="movie-info">
                                <ui:repeat var="genre" value="#{concertBean.getGenres(concert)}">
                                    <span class="badge bg-danger">#{genre}</span>
                                </ui:repeat>
                                <div class="concert-details mt-2">
                                    <small class="d-block"><i class="bi bi-calendar-event"></i> #{concert.concertDate}</small>
                                    <small class="d-block"><i class="bi bi-clock"></i> #{concert.concertTime} Uhr</small>
                                    <small class="d-block"><i class="bi bi-geo-alt"></i> #{concert.venue.name}</small>
                                    <span class="badge bg-success mt-1">ab #{concert.price}€</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer d-flex flex-wrap gap-2 justify-content-between">
                            <button class="btn btn-info" onclick="showConcertDetails(this.closest('.card'))"><i class="bi bi-info-circle"></i> Mehr Info</button>
                            <button class="btn btn-primary" onclick="bookTickets(this.closest('.card'))"><i class="bi bi-ticket-perforated"></i> Tickets</button>
                        </div>
                    </div>
                </div>
            </ui:repeat>
        </div>
    </div>

    <div class="modal fade" id="concertDetailModal" tabindex="-1" aria-labelledby="concertDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <!-- Modal content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
