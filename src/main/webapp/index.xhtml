<!DOCTYPE html>
<html lang="de"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IU Concerts - Tickets für deine Lieblingsbands</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-music-note-beamed"></i> IU Concerts</a>
        </div>
    </nav>

    <div class="container mt-4 mt-lg-5">
        <h1 class="text-center mb-3 mb-lg-4">🎸 Kommende Konzerte 🎤</h1>
        
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3 g-lg-4">
            <ui:repeat var="concert" value="#{concertBean.getAllConcerts()}">
                <div class="col">
                    <div class="card h-100 concert-card" 
                         data-concert-id="#{concert.concertId}" 
                         data-venue="#{concert.venue.name}">
                        <img src="#{concert.band.cover}" class="card-img-top" alt="#{concert.band.bandName}" />
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">#{concert.band.bandName}</h5>
                            <p class="card-text flex-grow-1">#{concert.band.shortDesc}</p>
                            <div class="movie-info">
                                <ui:repeat var="genre" value="#{concertBean.getGenres(concert)}">
                                    <span class="badge bg-danger">#{genre}</span>
                                </ui:repeat>
                                <div class="concert-details mt-2">
                                    <small class="d-block"><i class="bi bi-calendar-event"></i> #{concert.concertDate}</small>
                                    <small class="d-block"><i class="bi bi-clock"></i> #{concert.concertTime} Uhr</small>
                                    <small class="d-block"><i class="bi bi-geo-alt"></i> #{concert.venue.name}</small>
                                    <span class="badge bg-success mt-1">ab #{concert.price}€</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer d-flex flex-wrap gap-2 justify-content-between">
                            <button class="btn btn-info" onclick="showConcertDetails(this.closest('.card'))"><i class="bi bi-info-circle"></i> Mehr Info</button>
                            <button class="btn btn-primary" onclick="bookTickets(this.closest('.card'))"><i class="bi bi-ticket-perforated"></i> Tickets</button>
                        </div>
                    </div>
                </div>
            </ui:repeat>
        </div>
    </div>

    <div class="modal fade" id="concertDetailModal" tabindex="-1" aria-labelledby="concertDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <!-- Modal content will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        console.log("Eingebettetes Script wird geladen");

        function showConcertDetails(cardElement) {
            console.log("showConcertDetails called");
            
            const title = cardElement.querySelector('.card-title').textContent;
            const image = cardElement.querySelector('.card-img-top').src;
            const venue = cardElement.getAttribute('data-venue');
            const concertId = cardElement.getAttribute('data-concert-id');
            const description = cardElement.querySelector('.card-text').textContent;
            const genres = Array.from(cardElement.querySelectorAll('.badge.bg-danger'))
                                .map(badge => badge.textContent)
                                .join(', ');
            
            const modalContent = `
                <div class="modal-header">
                    <h5 class="modal-title">${title}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4">
                            <img src="${image}" class="img-fluid rounded mb-3" alt="${title}" style="max-height: 300px; object-fit: cover;"/>
                        </div>
                        <div class="col-md-8">
                            <h6>Ort</h6>
                            <p><strong>${venue}</strong></p>
                            <h6>Beschreibung</h6>
                            <p>${description}</p>
                            <h6>Genres</h6>
                            <p>${genres}</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
                    <button type="button" class="btn btn-primary" onclick="bookTicketsFromModal(this)">Tickets buchen</button>
                </div>
            `;
            
            const concertModalElement = document.getElementById('concertDetailModal');
            const modalContentContainer = concertModalElement.querySelector('.modal-content');
            
            // Vorherigen Inhalt leeren und neuen Inhalt einfügen
            modalContentContainer.innerHTML = modalContent;
            
            // Modal anzeigen
            const modal = new bootstrap.Modal(concertModalElement);
            modal.show();
            
            // Debug: Überprüfen Sie den Modal-Inhalt in der Konsole
            console.log("Modal content set:", modalContentContainer.innerHTML);
        }

        function bookTicketsFromModal(buttonElement) {
            // Finden Sie die Karte, die das Modal geöffnet hat
            const cardElement = document.querySelector('.concert-card[data-concert-id]');
            if (cardElement) {
                const concertId = cardElement.getAttribute('data-concert-id');
                window.location.href = `booking.xhtml?concertId=${concertId}`;
            }
        }

        function bookTickets(cardElement) {
            console.log("bookTickets called");
            
            try {
                const concertId = cardElement.getAttribute('data-concert-id');
                window.location.href = `booking.xhtml?concertId=${concertId}`;
            } catch (error) {
                console.error('Error during booking:', error);
            }
        }

        // Funktionen global verfügbar machen
        window.showConcertDetails = showConcertDetails;
        window.bookTickets = bookTickets;
        window.bookTicketsFromModal = bookTicketsFromModal;

        console.log("Funktionen wurden registriert");
    </script>
</body>
</html>
